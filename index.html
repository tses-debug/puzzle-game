<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>繪本互動拼圖闖關</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 { color: #2c3e50; font-size: 24px; margin: 10px 0; }
        .screen {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            display: none;
            text-align: center;
            box-sizing: border-box;
        }
        .active { display: block; }
        
        #game-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 98vh;
            max-width: 1200px;
            padding: 10px;
        }
        #game-screen.active { display: flex; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header-bar h2 { margin: 0; font-size: 20px; }

        .form-group { margin: 15px 0; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #2980b9; }
        .btn-green { background-color: #2ecc71; }
        .btn-green:hover { background-color: #27ae60; }
        .btn-gray { background-color: #95a5a6; }
        
        #game-container {
            flex-grow: 1;
            position: relative;
            border: 4px solid #34495e;
            border-radius: 10px;
            background-color: #ecf0f1;
            overflow: hidden;
            width: 100%;
        }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #bdc3c7; padding: 10px; text-align: center; }
        th { background-color: #3498db; color: white; }

        /* 過關慶祝彈視窗 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
            max-width: 400px;
            width: 85%;
            animation: popIn 0.3s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- 登入與設定畫面 -->
    <div id="login-screen" class="screen active">
        <h1>🎨 繪本真實拼圖挑戰</h1>
        <div class="form-group">
            <label>選擇班級</label>
            <select id="class-select" onchange="updateAvailablePuzzles()">
                <option value="一年甲班">一年甲班</option>
