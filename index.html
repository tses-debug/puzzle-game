<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>繪本互動拼圖闖關</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f8ff; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; height: 100vh; box-sizing: border-box; }
        h1 { color: #2c3e50; font-size: 24px; margin: 10px 0; }
        .screen { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 800px; width: 100%; display: none; text-align: center; box-sizing: border-box; }
        .active { display: block; }
        
        #game-screen { display: none; flex-direction: column; width: 100%; height: 98vh; max-width: 1200px; padding: 10px; }
        #game-screen.active { display: flex; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .header-bar h2 { margin: 0; font-size: 20px; color: #2c3e50; }
        
        .form-group { margin: 15px 0; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        select, input { width: 100%; padding: 10px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin: 5px; }
        button:hover { background-color: #2980b9; }
        .btn-green { background-color: #2ecc71; font-size: 18px; padding: 12px 25px; }
        .btn-green:hover { background-color: #27ae60; }
        .btn-gray { background-color: #95a5a6; }
        .btn-gray:hover { background-color: #7f8c8d; }
        
        #game-container { flex-grow: 1; position: relative; border: 4px solid #34495e; border-radius: 10px; background-color: #ecf0f1; overflow: hidden; width: 100%; }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #bdc3c7; padding: 10px; text-align: center; }
        th { background-color: #3498db; color: white; }
        
        /* 集章卡樣式 */
        .stamp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; margin: 20px 0; }
        .stamp-slot { background: #fdfefe; border: 3px dashed #bdc3c7; border-radius: 10px; padding: 15px 5px; font-size: 14px; font-weight: bold; color: #7f8c8d; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100px; transition: 0.3s; }
        .stamp-slot.completed { border: 3px solid #f1c40f; background: #fffde7; color: #d35400; box-shadow: 0 4px 6px rgba(241, 196, 15, 0.2); }
        .stamp-icon { font-size: 32px; margin-bottom: 5px; }
        
        /* 彈視窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 5px 25px rgba(0,0,0,0.3); max-width: 450px; width: 90%; animation: popIn 0.3s ease-out; }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .quiz-options button { background-color: #f39c12; font-size: 16px; padding: 12px; }
        .quiz-options button:hover { background-color: #e67e22; }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <!-- 1. 登入畫面 (極簡版) -->
    <div id="login-screen" class="screen active">
        <h1>🎨 繪本真實拼圖挑戰</h1>
        <div class="form-group">
            <label>選擇班級</label>
            <select id="class-select">
                <option value="一年甲班">一年甲班</option>
                <option value="二年甲班">二年甲班</option>
                <option value="三年甲班">三年甲班</option>
                <option value="三年乙班">三年乙班</option>
                <option value="四年甲班">四年甲班</option>
                <option value="五年甲班">五年甲班</option>
                <option value="六年甲班">六年甲班</option>
            </select>
        </div>
        <div class="form-group">
            <label>輸入姓名</label>
            <input type="text" id="student-name" placeholder="請輸入你的名字" required>
        </div>
        <button class="btn-green" onclick="enterStampCard()">進入我的集章卡</button>
        <br><br><hr><br>
        <button class="btn-gray" onclick="showDashboard()">👨‍🏫 教師後台</button>
    </div>

    <!-- 2. 集章卡畫面 -->
    <div id="stamp-screen" class="screen">
        <h2 id="stamp-title">我的集章卡</h2>
        <div class="stamp-grid" id="stamp-grid"></div>
        <button id="draw-puzzle-btn" class="btn-green" onclick="startRandomPuzzle()">🎲 抽取下一關</button>
        <button class="btn-gray" onclick="switchScreen('login-screen')">返回登入</button>
    </div>

    <!-- 3. 遊戲畫面 -->
    <div id="game-screen" class="screen">
        <div class="header-bar">
            <h2 id="game-title">❓ 神秘拼圖挑戰中...</h2>
            <button class="btn-gray" onclick="saveAndExit()">💾 存檔離開</button>
        </div>
        <div id="loading-msg">圖片載入中...</div>
        <div id="game-container">
            <canvas id="puzzle-canvas"></canvas>
        </div>
    </div>

    <!-- 4. 教師後台畫面 (只記錄全破關學生) -->
    <div id="dashboard-screen" class="screen">
        <h2>👨‍🏫 全破關榮譽榜</h2>
        <p>此名單只會顯示「已經完成全部 10 張拼圖」的學生</p>
        <button class="btn-gray" onclick="switchScreen('login-screen')">返回首頁</button>
        <button class="btn-gray" onclick="clearRecords()">清空紀錄</button>
        <table>
            <thead><tr><th>班級</th><th>姓名</th><th>完成全破關時間</th></tr></thead>
            <tbody id="records-body"></tbody>
        </table>
    </div>

    <!-- 5. 過關測驗彈視窗 (選書名) -->
    <div id="quiz-modal" class="modal">
        <div class="modal-content">
            <h2>🎉 拼圖完成！</h2>
            <p>請問這幅完整的畫作，是出自哪一本繪本呢？<br><small>(答對才能獲得印章喔！)</small></p>
            <div class="quiz-options" id="quiz-options-container"></div>
            <p id="quiz-feedback" style="color: #e74c3c; font-weight: bold; min-height: 24px; margin-top: 10px;"></p>
        </div>
    </div>

<script>
    // --- 安全存儲機制 ---
    let memoryStorage = {};
    function safeGetItem(key) { try { return localStorage.getItem(key) || memoryStorage[key] || null; } catch(e) { return memoryStorage[key] || null; } }
    function safeSetItem(key, value) { try { localStorage.setItem(key, value); } catch(e) { memoryStorage[key] = value; } }
    function safeRemoveItem(key) { try { localStorage.removeItem(key); } catch(e) { delete memoryStorage[key]; } }
    // -------------------

    const allPuzzles = [
        { file: '12婆姐.jpg', title: '12婆姐' },
        { file: '拼被人去旅行.jpg', title: '拼被人去旅行' },
        { file: '少年西拉雅.jpg', title: '少年西拉雅' },
        { file: '外婆住在香水村.jpg', title: '外婆住在香水村' },
        { file: '橡皮頭蹦太郎.jpg', title: '橡皮頭蹦太郎' },
        { file: '獨眼貓.jpg', title: '獨眼貓' },
        { file: '洪通繪畫無師自通.jpg', title: '洪通繪畫無師自通' },
        { file: '海之生.jpg', title: '海之生' },
        { file: '曾文溪的故事.jpg', title: '曾文溪的故事' },
        { file: '小兔彼得的故事.jpg', title: '小兔彼得的故事' }
    ];

    let canvas = document.getElementById('puzzle-canvas');
    let ctx = canvas.getContext('2d');
    let img = new Image();
    
    let pieces = [];
    let cols, rows;
    let puzzleWidth, puzzleHeight;
    let pieceWidth, pieceHeight;
    let boardStartX, boardStartY;
    
    let selectedPiece = null;
    let isDragging = false;
    let currentUser = {};
    let isCompleted = false;

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    // 自動判斷難度
    function determineGridSize(className) {
        if (className.includes('一年') || className.includes('二年')) return 4;
        if (className.includes('三年') || className.includes('四年')) return 5;
        return 6; 
    }

    function enterStampCard() {
        let name = document.getElementById('student-name').value.trim();
        if (!name) return alert('請先輸入姓名！');
        let className = document.getElementById('class-select').value;
        
        currentUser = {
            className: className,
            name: name,
            gridSize: determineGridSize(className)
        };

        document.getElementById('stamp-title').innerText = `${className} ${name} 的集章卡`;
        
        let recordsData = safeGetItem('puzzleRecords');
        let records = recordsData ? JSON.parse(recordsData) : [];
        let completedTitles = records.filter(r => r.name === name && r.className === className).map(r => r.puzzle);

        let gridHtml = '';
        allPuzzles.forEach(p => {
            if (completedTitles.includes(p.title)) {
                gridHtml += `<div class="stamp-slot completed"><div class="stamp-icon">🏅</div>${p.title}</div>`;
            } else {
                gridHtml += `<div class="stamp-slot locked"><div class="stamp-icon">🔒</div>未解鎖</div>`;
            }
        });
        document.getElementById('stamp-grid').innerHTML = gridHtml;

        let btn = document.getElementById('draw-puzzle-btn');
        let savedDataStr = safeGetItem(`puzzleSave_${currentUser.className}_${currentUser.name}`);
        
        if (completedTitles.length === allPuzzles.length) {
            btn.innerText = "🎉 最終挑戰完成！已全破關！";
            btn.disabled = true;
            btn.style.backgroundColor = "#95a5a6";
        } else if (savedDataStr) {
            btn.innerText = "▶ 繼續未完成的關卡";
            btn.disabled = false;
            btn.style.backgroundColor = "#e67e22";
        } else {
            btn.innerText = "🎲 抽取神秘下一關";
            btn.disabled = false;
            btn.style.backgroundColor = "#2ecc71";
        }

        switchScreen('stamp-screen');
    }

    function startRandomPuzzle() {
        isCompleted = false;
        document.getElementById('game-title').innerText = "❓ 神秘拼圖挑戰中...";

        let saveKey = `puzzleSave_${currentUser.className}_${currentUser.name}`;
        let savedDataStr = safeGetItem(saveKey);

        if (savedDataStr) {
            let savedData = JSON.parse(savedDataStr);
            currentUser.imageName = savedData.imageName;
            currentUser.puzzleName = savedData.puzzleName;
            loadAndStartCanvas();
            return;
        }

        let recordsData = safeGetItem('puzzleRecords');
        let records = recordsData ? JSON.parse(recordsData) : [];
        let completedTitles = records.filter(r => r.name === currentUser.name && r.className === currentUser.className).map(r => r.puzzle);
        
        let available = allPuzzles.filter(p => !completedTitles.includes(p.title));
        if (available.length === 0) return alert('你已經獲得所有印章囉！');

        let randomTarget = available[Math.floor(Math.random() * available.length)];
        currentUser.imageName = randomTarget.file;
        currentUser.puzzleName = randomTarget.title;

        loadAndStartCanvas();
    }

    function loadAndStartCanvas() {
        switchScreen('game-screen');
        img.onload = () => { document.getElementById('loading-msg').style.display = 'none'; initPuzzle(); };
        img.onerror = () => { alert('找不到圖片檔，請確認圖片已上傳。'); enterStampCard(); };
        document.getElementById('loading-msg').style.display = 'block';
        img.src = currentUser.imageName;
    }

    function initPuzzle() {
        let container = document.getElementById('game-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        cols = currentUser.gridSize; rows = currentUser.gridSize;

        let isPortrait = canvas.height > canvas.width;
        let maxWidth = isPortrait ? canvas.width * 0.9 : canvas.width * 0.55;
        let maxHeight = isPortrait ? canvas.height * 0.55 : canvas.height * 0.9;
        
        let scale = Math.min(maxWidth / img.width, maxHeight / img.height);
        puzzleWidth = img.width * scale; puzzleHeight = img.height * scale;
        pieceWidth = puzzleWidth / cols; pieceHeight = puzzleHeight / rows;
        boardStartX = 20; boardStartY = 20;

        let savedDataStr = safeGetItem(`puzzleSave_${currentUser.className}_${currentUser.name}`);
        let savedData = savedDataStr ? JSON.parse(savedDataStr) : null;
        
        if (savedData && savedData.gridSize === currentUser.gridSize && savedData.imageName === currentUser.imageName) {
            pieces = savedData.pieces;
        } else {
            createAndScatterPieces(isPortrait);
        }
        
        drawAll(); setupEvents();
    }

    function createAndScatterPieces(isPortrait) {
        pieces = [];
        let horizontalTabs = []; let verticalTabs = [];   
        for(let y=0; y<rows; y++) {
            let rowT = []; for(let x=0; x<cols-1; x++) rowT.push(Math.random() > 0.5 ? 1 : -1);
            horizontalTabs.push(rowT);
        }
        for(let y=0; y<rows-1; y++) {
            let colT = []; for(let x=0; x<cols; x++) colT.push(Math.random() > 0.5 ? 1 : -1);
            verticalTabs.push(colT);
        }

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                let piece = {
                    correctX: boardStartX + x * pieceWidth, correctY: boardStartY + y * pieceHeight,
                    currentX: 0, currentY: 0, w: pieceWidth, h: pieceHeight, col: x, row: y, isLocked: false,
                    topTab: (y === 0) ? 0 : -verticalTabs[y-1][x],
                    bottomTab: (y === rows - 1) ? 0 : verticalTabs[y][x],
                    leftTab: (x === 0) ? 0 : -horizontalTabs[y][x-1],
                    rightTab: (x === cols - 1) ? 0 : horizontalTabs[y][x]
                };
                if (isPortrait) {
                    let trayStartY = boardStartY + puzzleHeight + 20; let trayHeight = canvas.height - trayStartY - pieceHeight;
                    piece.currentX = Math.random() * (canvas.width - pieceWidth);
                    piece.currentY = trayStartY + Math.random() * (trayHeight > 0 ? trayHeight : 0);
                } else {
                    let trayStartX = boardStartX + puzzleWidth + 20; let trayWidth = canvas.width - trayStartX - pieceWidth;
                    piece.currentX = trayStartX + Math.random() * (trayWidth > 0 ? trayWidth : 0);
                    piece.currentY = Math.random() * (canvas.height - pieceHeight);
                }
                piece.currentX = Math.max(0, Math.min(piece.currentX, canvas.width - pieceWidth));
                piece.currentY = Math.max(0, Math.min(piece.currentY, canvas.height - pieceHeight));
                pieces.push(piece);
            }
        }
    }

    function buildPiecePath(ctx, p, w, h) {
        ctx.beginPath(); ctx.moveTo(0, 0);
        if (p.topTab === 0) ctx.lineTo(w, 0);
        else { let s = p.topTab; ctx.lineTo(w * 0.38, 0); ctx.bezierCurveTo(w * 0.38, s * -h * 0.2, w * 0.25, s * -h * 0.3, w * 0.5, s * -h * 0.3); ctx.bezierCurveTo(w * 0.75, s * -h * 0.3, w * 0.62, s * -h * 0.2, w * 0.62, 0); ctx.lineTo(w, 0); }
        if (p.rightTab === 0) ctx.lineTo(w, h);
        else { let s = p.rightTab; ctx.lineTo(w, h * 0.38); ctx.bezierCurveTo(w + s * w * 0.2, h * 0.38, w + s * w * 0.3, h * 0.25, w + s * w * 0.3, h * 0.5); ctx.bezierCurveTo(w + s * w * 0.3, h * 0.75, w + s * w * 0.2, h * 0.62, w, h * 0.62); ctx.lineTo(w, h); }
        if (p.bottomTab === 0) ctx.lineTo(0, h);
        else { let s = p.bottomTab; ctx.lineTo(w * 0.62, h); ctx.bezierCurveTo(w * 0.62, h + s * h * 0.2, w * 0.75, h + s * h * 0.3, w * 0.5, h + s * h * 0.3); ctx.bezierCurveTo(w * 0.25, h + s * h * 0.3, w * 0.38, h + s * h * 0.2, w * 0.38, h); ctx.lineTo(0, h); }
        if (p.leftTab === 0) ctx.lineTo(0, 0);
        else { let s = p.leftTab; ctx.lineTo(0, h * 0.62); ctx.bezierCurveTo(s * -w * 0.2, h * 0.62, s * -w * 0.3, h * 0.75, s * -w * 0.3, h * 0.5); ctx.bezierCurveTo(s * -w * 0.3, h * 0.25, s * -w * 0.2, h * 0.38, 0, h * 0.38); ctx.lineTo(0, 0); }
    }

    function drawAll() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (isCompleted) {
            ctx.drawImage(img, boardStartX, boardStartY, puzzleWidth, puzzleHeight);
            ctx.strokeStyle = '#f1c40f'; ctx.lineWidth = 4; ctx.strokeRect(boardStartX, boardStartY, puzzleWidth, puzzleHeight);
            return;
        }
        ctx.save();
        ctx.fillStyle = 'rgba(236, 240, 241, 0.6)'; ctx.fillRect(boardStartX, boardStartY, puzzleWidth, puzzleHeight);
        ctx.strokeStyle = '#bdc3c7'; ctx.lineWidth = 1.5;
        pieces.forEach(p => { ctx.save(); ctx.translate(p.correctX, p.correctY); buildPiecePath(ctx, p, p.w, p.h); ctx.stroke(); ctx.restore(); });
        ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 2.5; ctx.strokeRect(boardStartX, boardStartY, puzzleWidth, puzzleHeight);
        ctx.restore();
        pieces.forEach(p => { if (p !== selectedPiece) drawPiece(p); });
        if (selectedPiece) drawPiece(selectedPiece);
    }

    function drawPiece(p) {
        ctx.save(); ctx.translate(p.currentX, p.currentY); buildPiecePath(ctx, p, p.w, p.h); ctx.clip();
        ctx.drawImage(img, 0, 0, img.width, img.height, -p.col * p.w, -p.row * p.h, puzzleWidth, puzzleHeight);
        ctx.lineWidth = p.isLocked ? 1 : 2.5; ctx.strokeStyle = p.isLocked ? 'rgba(0,0,0,0.1)' : '#34495e'; ctx.stroke(); ctx.restore();
    }

    function setupEvents() {
        canvas.onmousedown = handleDown; canvas.onmousemove = handleMove; canvas.onmouseup = handleUp; canvas.onmouseleave = handleUp;
        canvas.ontouchstart = (e) => { e.preventDefault(); handleDown(e.touches[0]); };
        canvas.ontouchmove = (e) => { e.preventDefault(); handleMove(e.touches[0]); };
        canvas.ontouchend = (e) => { e.preventDefault(); handleUp(); };
    }

    function handleDown(e) {
        if (isCompleted) return;
        let rect = canvas.getBoundingClientRect(); let scaleX = canvas.width / rect.width; let scaleY = canvas.height / rect.height;
        let mouseX = (e.clientX - rect.left) * scaleX; let mouseY = (e.clientY - rect.top) * scaleY;
        for (let i = pieces.length - 1; i >= 0; i--) {
            let p = pieces[i];
            if (!p.isLocked && mouseX >= p.currentX && mouseX <= p.currentX + p.w && mouseY >= p.currentY && mouseY <= p.currentY + p.h) {
                selectedPiece = p; isDragging = true; pieces.splice(i, 1); pieces.push(selectedPiece); break;
            }
        }
    }

    function handleMove(e) {
        if (!isDragging || !selectedPiece || isCompleted) return;
        let rect = canvas.getBoundingClientRect(); let scaleX = canvas.width / rect.width; let scaleY = canvas.height / rect.height;
        selectedPiece.currentX = (e.clientX - rect.left) * scaleX - (pieceWidth / 2);
        selectedPiece.currentY = (e.clientY - rect.top) * scaleY - (pieceHeight / 2); drawAll();
    }

    function handleUp() {
        if (!isDragging || !selectedPiece || isCompleted) return;
        let diffX = Math.abs(selectedPiece.currentX - selectedPiece.correctX); let diffY = Math.abs(selectedPiece.currentY - selectedPiece.correctY);
        if (diffX < pieceWidth * 0.25 && diffY < pieceHeight * 0.25) { selectedPiece.currentX = selectedPiece.correctX; selectedPiece.currentY = selectedPiece.correctY; selectedPiece.isLocked = true; }
        isDragging = false; selectedPiece = null; drawAll(); checkWin();
    }

    function checkWin() {
        if (pieces.every(p => p.isLocked)) {
            isCompleted = true; drawAll();
            setTimeout(() => { triggerQuiz(); }, 500);
        }
    }

    function triggerQuiz() {
        document.getElementById('quiz-feedback').innerText = "";
        let correctTitle = currentUser.puzzleName;
        let wrongOptions = allPuzzles.filter(p => p.title !== correctTitle).map(p => p.title);
        
        wrongOptions.sort(() => 0.5 - Math.random());
        let options = [correctTitle, wrongOptions[0], wrongOptions[1], wrongOptions[2]];
        options.sort(() => 0.5 - Math.random());

        let html = options.map(opt => `<button onclick="checkAnswer('${opt}')">${opt}</button>`).join('');
        document.getElementById('quiz-options-container').innerHTML = html;
        document.getElementById('quiz-modal').style.display = 'flex';
    }

    function checkAnswer(selectedTitle) {
        if (selectedTitle === currentUser.puzzleName) {
            alert('🎉 答對了！恭喜獲得一枚印章！');
            document.getElementById('quiz-modal').style.display = 'none';
            saveRecord();
            safeRemoveItem(`puzzleSave_${currentUser.className}_${currentUser.name}`);
            
            // 檢查是否全部破關
            let recordsData = safeGetItem('puzzleRecords');
            let records = recordsData ? JSON.parse(recordsData) : [];
            let completedCount = records.filter(r => r.name === currentUser.name && r.className === currentUser.className).length;
            if (completedCount === 10) {
                alert('🏆 狂賀！你已經收集到所有 10 枚印章，完成最終挑戰！請告訴老師來兌換獎勵！');
            }
            enterStampCard();
        } else {
            document.getElementById('quiz-feedback').innerText = "哎呀，答錯囉！請仔細觀察圖片再試一次！";
        }
    }

    function saveAndExit() {
        if (!isCompleted) {
            let saveData = { imageName: currentUser.imageName, puzzleName: currentUser.puzzleName, gridSize: currentUser.gridSize, pieces: pieces };
            safeSetItem(`puzzleSave_${currentUser.className}_${currentUser.name}`, JSON.stringify(saveData));
            alert('進度已儲存！下次進來可以直接繼續。');
        }
        enterStampCard();
    }

    function saveRecord() {
        let recordsData = safeGetItem('puzzleRecords');
        let records = recordsData ? JSON.parse(recordsData) : [];
        
        // 避免重複寫入同一題
        let alreadySaved = records.some(r => r.name === currentUser.name && r.className === currentUser.className && r.puzzle === currentUser.puzzleName);
        if (!alreadySaved) {
            let now = new Date();
            records.push({
                className: currentUser.className, name: currentUser.name, puzzle: currentUser.puzzleName,
                date: now.toLocaleDateString() + ' ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0')
            });
            safeSetItem('puzzleRecords', JSON.stringify(records));
        }
    }

    function showDashboard() {
        let recordsData = safeGetItem('puzzleRecords');
        let records = recordsData ? JSON.parse(recordsData) : [];
        
        // 依照學生分組，計算每個人完成的印章數
        let students = {};
        records.forEach(r => {
            let key = r.className + "_" + r.name;
            if (!students[key]) {
                students[key] = { className: r.className, name: r.name, completed: new Set(), lastDate: r.date };
            }
            students[key].completed.add(r.puzzle);
            students[key].lastDate = r.date;
        });

        let tbody = document.getElementById('records-body');
        tbody.innerHTML = '';
        
        let hasGraduates = false;
        for (let key in students) {
            if (students[key].completed.size === 10) { // 只顯示完成 10 張的人
                hasGraduates = true;
                tbody.innerHTML += `<tr><td>${students[key].className}</td><td>${students[key].name}</td><td>${students[key].lastDate}</td></tr>`;
            }
        }

        if (!hasGraduates) {
            tbody.innerHTML = `<tr><td colspan="3" style="padding: 20px; color: #7f8c8d;">目前尚未有完成全部 10 幅拼圖的學生。</td></tr>`;
        }
        
        switchScreen('dashboard-screen');
    }

    function clearRecords() {
        if(confirm('確定要清空所有紀錄嗎？(包含學生的集章卡進度都會歸零喔)')) {
            safeRemoveItem('puzzleRecords');
            showDashboard();
        }
    }
</script>
</body>
</html>
