<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>繪本互動拼圖闖關</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f8ff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 { color: #2c3e50; font-size: 24px; margin: 10px 0; }
        .screen {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            display: none;
            text-align: center;
            box-sizing: border-box;
        }
        .active { display: block; }
        
        #game-screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 98vh;
            max-width: 1200px;
            padding: 10px;
        }
        #game-screen.active { display: flex; }
        
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .header-bar h2 { margin: 0; font-size: 20px; }

        .form-group { margin: 15px 0; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; }
        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { background-color: #2980b9; }
        .btn-gray { background-color: #95a5a6; }
        
        #game-container {
            flex-grow: 1;
            position: relative;
            border: 4px solid #34495e;
            border-radius: 10px;
            background-color: #ecf0f1;
            overflow: hidden;
            width: 100%;
        }
        canvas { display: block; touch-action: none; width: 100%; height: 100%; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #bdc3c7; padding: 10px; text-align: center; }
        th { background-color: #3498db; color: white; }
    </style>
</head>
<body>

    <!-- 登入與設定畫面 -->
    <div id="login-screen" class="screen active">
        <h1>🎨 繪本真實拼圖挑戰</h1>
        <div class="form-group">
            <label>選擇班級</label>
            <select id="class-select">
                <option value="一年甲班">一年甲班</option>
                <option value="二年甲班">二年甲班</option>
                <option value="三年甲班">三年甲班</option>
                <option value="三年乙班">三年乙班</option>
                <option value="四年甲班">四年甲班</option>
                <option value="五年甲班">五年甲班</option>
                <option value="六年甲班">六年甲班</option>
            </select>
        </div>
        <div class="form-group">
            <label>輸入姓名</label>
            <input type="text" id="student-name" placeholder="請輸入你的名字" required>
        </div>
        <div class="form-group">
            <label>選擇難度</label>
            <select id="difficulty-select">
                <option value="4">低年級 (16片)</option>
                <option value="5">中年級 (25片)</option>
                <option value="6">高年級 (36片)</option>
            </select>
        </div>
        <div class="form-group">
            <label>選擇拼圖</label>
            <select id="image-select">
                <option value="12婆姐.jpg">12婆姐</option>
                <option value="拼被人去旅行.jpg">拼被人去旅行</option>
                <option value="少年西拉雅.jpg">少年西拉雅</option>
                <option value="外婆住在香水村.jpg">外婆住在香水村</option>
                <option value="橡皮頭蹦太郎.jpg">橡皮頭蹦太郎</option>
                <option value="獨眼貓.jpg">獨眼貓</option>
                <option value="洪通繪畫無師自通.jpg">洪通繪畫無師自通</option>
                <option value="海之生.jpg">海之生</option>
                <option value="曾文溪的故事.jpg">曾文溪的故事</option>
                <option value="小兔彼得的故事.jpg">小兔彼得的故事</option>
            </select>
        </div>
        <button onclick="startGame()">開始闖關</button>
        <br><br><hr><br>
        <button class="btn-gray" onclick="showDashboard()">👨‍🏫 教師後台</button>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen" class="screen">
        <div class="header-bar">
            <h2 id="game-title">拼圖中...</h2>
            <button class="btn-gray" onclick="saveAndExit()">💾 存檔離開</button>
        </div>
        <div id="loading-msg">圖片載入中...</div>
        <div id="game-container">
            <canvas id="puzzle-canvas"></canvas>
        </div>
    </div>

    <!-- 教師後台畫面 -->
    <div id="dashboard-screen" class="screen">
        <h2>👨‍🏫 過關紀錄名單</h2>
        <button class="btn-gray" onclick="showLogin()">返回首頁</button>
        <button class="btn-gray" onclick="clearRecords()">清空紀錄</button>
        <table>
            <thead>
                <tr>
                    <th>班級</th>
                    <th>姓名</th>
                    <th>完成拼圖</th>
                    <th>難度</th>
                    <th>完成時間</th>
                </tr>
            </thead>
            <tbody id="records-body"></tbody>
        </table>
    </div>

<script>
    let canvas = document.getElementById('puzzle-canvas');
    let ctx = canvas.getContext('2d');
    let img = new Image();
    // 若放網路圖床，需加上這行： img.crossOrigin = "Anonymous";
    
    let pieces = [];
    let cols, rows;
    let puzzleWidth, puzzleHeight;
    let pieceWidth, pieceHeight;
    let boardStartX, boardStartY;
    
    let selectedPiece = null;
    let isDragging = false;
    let currentUser = {};

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function showLogin() { switchScreen('login-screen'); }

    function showDashboard() {
        let records = JSON.parse(localStorage.getItem('puzzleRecords')) || [];
        let tbody = document.getElementById('records-body');
        tbody.innerHTML = '';
        records.forEach(r => {
            tbody.innerHTML += `<tr><td>${r.className}</td><td>${r.name}</td><td>${r.puzzle}</td><td>${r.difficulty}</td><td>${r.date}</td></tr>`;
        });
        switchScreen('dashboard-screen');
    }

    function clearRecords() {
        if(confirm('確定要清空所有紀錄嗎？')) {
            localStorage.removeItem('puzzleRecords');
            showDashboard();
        }
    }

    function startGame() {
        let name = document.getElementById('student-name').value.trim();
        if (!name) return alert('請輸入姓名！');

        currentUser = {
            className: document.getElementById('class-select').value,
            name: name,
            gridSize: parseInt(document.getElementById('difficulty-select').value),
            imageName: document.getElementById('image-select').value,
            puzzleName: document.getElementById('image-select').options[document.getElementById('image-select').selectedIndex].text
        };

        document.getElementById('game-title').innerText = currentUser.puzzleName;
        switchScreen('game-screen');
        
        img.onload = () => {
            document.getElementById('loading-msg').style.display = 'none';
            initPuzzle();
        };
        img.onerror = () => {
            alert('找不到圖片檔，請確認圖片檔名正確。');
            showLogin();
        };
        document.getElementById('loading-msg').style.display = 'block';
        img.src = currentUser.imageName;
    }

    function initPuzzle() {
        let container = document.getElementById('game-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        
        cols = currentUser.gridSize;
        rows = currentUser.gridSize;

        let isPortrait = canvas.height > canvas.width;
        let maxWidth = isPortrait ? canvas.width * 0.9 : canvas.width * 0.55;
        let maxHeight = isPortrait ? canvas.height * 0.55 : canvas.height * 0.9;
        
        let scale = Math.min(maxWidth / img.width, maxHeight / img.height);
        puzzleWidth = img.width * scale;
        puzzleHeight = img.height * scale;
        pieceWidth = puzzleWidth / cols;
        pieceHeight = puzzleHeight / rows;

        boardStartX = 20;
        boardStartY = 20;

        let savedData = JSON.parse(localStorage.getItem('puzzleSave_' + currentUser.name + '_' + currentUser.imageName));
        
        if (savedData && savedData.gridSize === currentUser.gridSize) {
            pieces = savedData.pieces;
        } else {
            createAndScatterPieces(isPortrait);
        }
        
        drawAll();
        setupEvents();
    }

    function createAndScatterPieces(isPortrait) {
        pieces = [];
        
        // 建立凹凸資料矩陣：1 (凸出), -1 (凹入)
        let horizontalTabs = []; 
        let verticalTabs = [];   
        for(let y=0; y<rows; y++) {
            let rowT = [];
            for(let x=0; x<cols-1; x++) rowT.push(Math.random() > 0.5 ? 1 : -1);
            horizontalTabs.push(rowT);
        }
        for(let y=0; y<rows-1; y++) {
            let colT = [];
            for(let x=0; x<cols; x++) colT.push(Math.random() > 0.5 ? 1 : -1);
            verticalTabs.push(colT);
        }

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                let piece = {
                    correctX: boardStartX + x * pieceWidth,
                    correctY: boardStartY + y * pieceHeight,
                    currentX: 0,
                    currentY: 0,
                    w: pieceWidth,
                    h: pieceHeight,
                    col: x,
                    row: y,
                    isLocked: false,
                    // 根據矩陣設定該拼圖的上下左右凹凸
                    topTab: (y === 0) ? 0 : -verticalTabs[y-1][x],
                    bottomTab: (y === rows - 1) ? 0 : verticalTabs[y][x],
                    leftTab: (x === 0) ? 0 : -horizontalTabs[y][x-1],
                    rightTab: (x === cols - 1) ? 0 : horizontalTabs[y][x]
                };

                // 分散到目標區之外
                if (isPortrait) {
                    let trayStartY = boardStartY + puzzleHeight + 20;
                    let trayHeight = canvas.height - trayStartY - pieceHeight;
                    piece.currentX = Math.random() * (canvas.width - pieceWidth);
                    piece.currentY = trayStartY + Math.random() * (trayHeight > 0 ? trayHeight : 0);
                } else {
                    let trayStartX = boardStartX + puzzleWidth + 20;
                    let trayWidth = canvas.width - trayStartX - pieceWidth;
                    piece.currentX = trayStartX + Math.random() * (trayWidth > 0 ? trayWidth : 0);
                    piece.currentY = Math.random() * (canvas.height - pieceHeight);
                }
                
                piece.currentX = Math.max(0, Math.min(piece.currentX, canvas.width - pieceWidth));
                piece.currentY = Math.max(0, Math.min(piece.currentY, canvas.height - pieceHeight));
                
                pieces.push(piece);
            }
        }
    }

    function buildPiecePath(ctx, p, w, h) {
        ctx.beginPath();
        ctx.moveTo(0, 0);

        // 頂部邊緣
        if (p.topTab === 0) ctx.lineTo(w, 0);
        else {
            let s = p.topTab;
            ctx.lineTo(w * 0.38, 0);
            ctx.bezierCurveTo(w * 0.38, s * -h * 0.2, w * 0.25, s * -h * 0.3, w * 0.5,  s * -h * 0.3);
            ctx.bezierCurveTo(w * 0.75, s * -h * 0.3, w * 0.62, s * -h * 0.2, w * 0.62, 0);
            ctx.lineTo(w, 0);
        }
        // 右側邊緣
        if (p.rightTab === 0) ctx.lineTo(w, h);
        else {
            let s = p.rightTab;
            ctx.lineTo(w, h * 0.38);
            ctx.bezierCurveTo(w + s * w * 0.2, h * 0.38, w + s * w * 0.3, h * 0.25, w + s * w * 0.3, h * 0.5);
            ctx.bezierCurveTo(w + s * w * 0.3, h * 0.75, w + s * w * 0.2, h * 0.62, w, h * 0.62);
            ctx.lineTo(w, h);
        }
        // 底部邊緣
        if (p.bottomTab === 0) ctx.lineTo(0, h);
        else {
            let s = p.bottomTab;
            ctx.lineTo(w * 0.62, h);
            ctx.bezierCurveTo(w * 0.62, h + s * h * 0.2, w * 0.75, h + s * h * 0.3, w * 0.5, h + s * h * 0.3);
            ctx.bezierCurveTo(w * 0.25, h + s * h * 0.3, w * 0.38, h + s * h * 0.2, w * 0.38, h);
            ctx.lineTo(0, h);
        }
        // 左側邊緣
        if (p.leftTab === 0) ctx.lineTo(0, 0);
        else {
            let s = p.leftTab;
            ctx.lineTo(0, h * 0.62);
            ctx.bezierCurveTo(s * -w * 0.2, h * 0.62, s * -w * 0.3, h * 0.75, s * -w * 0.3, h * 0.5);
            ctx.bezierCurveTo(s * -w * 0.3, h * 0.25, s * -w * 0.2, h * 0.38, 0, h * 0.38);
            ctx.lineTo(0, 0);
        }
    }

    function drawAll() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 畫出目標區外框
        ctx.strokeStyle = '#bdc3c7';
        ctx.lineWidth = 2;
        ctx.strokeRect(boardStartX, boardStartY, puzzleWidth, puzzleHeight);

        pieces.forEach(p => { if (p !== selectedPiece) drawPiece(p); });
        if (selectedPiece) drawPiece(selectedPiece);
    }

    function drawPiece(p) {
        ctx.save();
        // 將畫布原點移動到該拼圖塊的左上角
        ctx.translate(p.currentX, p.currentY);
        
        // 繪製貝茲曲線路徑並進行裁切
        buildPiecePath(ctx, p, p.w, p.h);
        ctx.clip();
        
        // 偏移圖片，讓該拼圖對應到完整的縮放圖片位置
        ctx.drawImage(img, 0, 0, img.width, img.height, -p.col * p.w, -p.row * p.h, puzzleWidth, puzzleHeight);
        
        // 畫出拼圖塊邊緣線
        ctx.lineWidth = p.isLocked ? 1 : 2.5;
        ctx.strokeStyle = p.isLocked ? 'rgba(0,0,0,0.1)' : '#34495e';
        ctx.stroke();
        
        ctx.restore();
    }

    function setupEvents() {
        canvas.onmousedown = handleDown;
        canvas.onmousemove = handleMove;
        canvas.onmouseup = handleUp;
        canvas.onmouseleave = handleUp;
        canvas.ontouchstart = (e) => { e.preventDefault(); handleDown(e.touches[0]); };
        canvas.ontouchmove = (e) => { e.preventDefault(); handleMove(e.touches[0]); };
        canvas.ontouchend = (e) => { e.preventDefault(); handleUp(); };
    }

    function handleDown(e) {
        let rect = canvas.getBoundingClientRect();
        let scaleX = canvas.width / rect.width;
        let scaleY = canvas.height / rect.height;
        let mouseX = (e.clientX - rect.left) * scaleX;
        let mouseY = (e.clientY - rect.top) * scaleY;

        for (let i = pieces.length - 1; i >= 0; i--) {
            let p = pieces[i];
            // 基礎矩形碰撞偵測 (方便點擊與拖曳)
            if (!p.isLocked && mouseX >= p.currentX && mouseX <= p.currentX + p.w &&
                mouseY >= p.currentY && mouseY <= p.currentY + p.h) {
                selectedPiece = p;
                isDragging = true;
                pieces.splice(i, 1);
                pieces.push(selectedPiece);
                break;
            }
        }
    }

    function handleMove(e) {
        if (!isDragging || !selectedPiece) return;
        let rect = canvas.getBoundingClientRect();
        let scaleX = canvas.width / rect.width;
        let scaleY = canvas.height / rect.height;
        
        selectedPiece.currentX = (e.clientX - rect.left) * scaleX - (pieceWidth / 2);
        selectedPiece.currentY = (e.clientY - rect.top) * scaleY - (pieceHeight / 2);
        drawAll();
    }

    function handleUp() {
        if (!isDragging || !selectedPiece) return;
        
        let diffX = Math.abs(selectedPiece.currentX - selectedPiece.correctX);
        let diffY = Math.abs(selectedPiece.currentY - selectedPiece.correctY);
        
        if (diffX < pieceWidth * 0.25 && diffY < pieceHeight * 0.25) {
            selectedPiece.currentX = selectedPiece.correctX;
            selectedPiece.currentY = selectedPiece.correctY;
            selectedPiece.isLocked = true;
        }

        isDragging = false;
        selectedPiece = null;
        drawAll();
        checkWin();
    }

    function checkWin() {
        if (pieces.every(p => p.isLocked)) {
            setTimeout(() => {
                alert('🎉 恭喜過關！你的紀錄已經儲存囉！');
                saveRecord();
                localStorage.removeItem('puzzleSave_' + currentUser.name + '_' + currentUser.imageName);
                showLogin();
            }, 300);
        }
    }

    function saveAndExit() {
        let saveData = { gridSize: currentUser.gridSize, pieces: pieces };
        localStorage.setItem('puzzleSave_' + currentUser.name + '_' + currentUser.imageName, JSON.stringify(saveData));
        alert('進度已儲存！下次使用相同姓名與圖片即可繼續。');
        showLogin();
    }

    function saveRecord() {
        let records = JSON.parse(localStorage.getItem('puzzleRecords')) || [];
        let now = new Date();
        records.push({
            className: currentUser.className,
            name: currentUser.name,
            puzzle: currentUser.puzzleName,
            difficulty: (currentUser.gridSize * currentUser.gridSize) + '片',
            date: now.toLocaleDateString() + ' ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0')
        });
        localStorage.setItem('puzzleRecords', JSON.stringify(records));
    }
</script>

</body>
</html>
